# Just the dependencies, for running the api and frontend on your own machine.
# The production stack is docker-compose.yml.
services:
  db:
    image: postgres:18-alpine
    container_name: memorisepdf-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: memorisepdf
      POSTGRES_PASSWORD: memorisepdf
      POSTGRES_DB: memorisepdf
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ wants a single mount here, not at /data: it stores
      # data in a major-version subdirectory so pg_upgrade --link works.
      - devpgdata:/var/lib/postgresql
    healthcheck:
      # A real query, not pg_isready: that reports success while the
      # database is still being created during first-boot init.
      test: ["CMD-SHELL", "psql -U memorisepdf -d memorisepdf -c 'select 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  tika:
    image: apache/tika:3.3.1.0-full
    container_name: memorisepdf-dev-tika
    restart: unless-stopped
    ports:
      - "127.0.0.1:9998:9998"

volumes:
  devpgdata:
